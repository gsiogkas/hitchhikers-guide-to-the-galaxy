[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hitchhikers-guide-to-the-galaxy"
version = "0.1.0"
description = "DeepThought.TheAnswerToLifeTheUniverseAndEverything -- seed with 42. A tribute to Douglas Adams."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Don't Panic Contributors" },
]
keywords = [
    "douglas-adams",
    "42",
    "hitchhikers-guide",
    "deep-thought",
    "seed",
    "vibe-coding",
    "tribute",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gsiogkas/hitchhikers-guide-to-the-galaxy"
Repository = "https://github.com/gsiogkas/hitchhikers-guide-to-the-galaxy"
"Don't Panic" = "https://en.wikipedia.org/wiki/The_Hitchhiker%27s_Guide_to_the_Galaxy"

[tool.setuptools.packages.find]
include = ["hitchhikers_guide_to_the_galaxy*"]
